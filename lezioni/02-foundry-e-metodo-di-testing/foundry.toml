[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["../../lib"]
solc_version = "0.8.37"
evm_version = "prague"
optimizer = true
optimizer_runs = 200

[profile.mutation]
src = "mutation/src"
test = "mutation/test"
script = "script"
out = "out/mutation"
cache_path = "cache/mutation"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
