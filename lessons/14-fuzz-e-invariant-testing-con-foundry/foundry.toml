[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["../../lib"]
solc = "0.8.37"
evm_version = "prague"
optimizer = true
optimizer_runs = 200

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true

[profile.deep.fuzz]
runs = 5000

[profile.deep.invariant]
runs = 1000
depth = 128
fail_on_revert = true

